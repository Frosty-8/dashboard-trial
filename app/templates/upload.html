<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SAP PPC Intelligence - Upload</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: grid;
            place-items: center;

            background: #f5f7fb;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: #111827;
        }

        .container {
            width: min(560px, calc(100% - 32px));

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            padding: 42px;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.08);
        }

        .logo {
            width: 48px;
            height: 48px;

            display: grid;
            place-items: center;

            border-radius: 12px;

            background: #2563eb;

            color: white;

            font-weight: 800;

            margin-bottom: 22px;
        }

        .eyebrow {
            color: #2563eb;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 0.12em;

            margin-bottom: 8px;
        }

        h1 {
            margin: 0;

            font-size: 28px;

            letter-spacing: -0.03em;
        }

        .subtitle {
            color: #6b7280;

            font-size: 14px;

            line-height: 1.6;

            margin: 10px 0 30px;
        }

        .upload-box {
            border: 2px dashed #d1d5db;

            border-radius: 14px;

            padding: 35px 20px;

            text-align: center;

            transition: 0.2s;
        }

        .upload-box:hover {
            border-color: #2563eb;

            background: #f8fbff;
        }

        input[type="file"] {
            width: 100%;

            margin-bottom: 20px;
        }

        button {
            width: 100%;

            padding: 13px;

            border: 0;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;

            cursor: wait;
        }

        .status {
            margin-top: 18px;

            color: #6b7280;

            font-size: 13px;

            text-align: center;
        }

        .error {
            color: #dc2626;
        }

    </style>

</head>


<body>

    <main class="container">

        <div class="logo">
            SP
        </div>

        <div class="eyebrow">
            PROCUREMENT PLANNING & CONTROL
        </div>

        <h1>
            SAP PPC Intelligence
        </h1>

        <p class="subtitle">
            Upload your SAP procurement report to generate
            inventory, procurement, supplier and forecast intelligence.
        </p>


        <form id="upload-form">

            <div class="upload-box">

                <input
                    id="file"
                    type="file"
                    name="file"
                    accept=".xlsx,.xlsb,.csv,.parquet"
                    required
                >

                <button
                    id="process-button"
                    type="submit"
                >
                    Process Report
                </button>

            </div>

        </form>


        <div
            id="status"
            class="status"
        >
            Supported formats: XLSX, XLSB, CSV, Parquet
        </div>

    </main>


    <script>

        const form =
            document.getElementById("upload-form");

        const fileInput =
            document.getElementById("file");

        const button =
            document.getElementById("process-button");

        const status =
            document.getElementById("status");


        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                const file =
                    fileInput.files[0];

                if (!file) {
                    status.textContent =
                        "Please select a file.";

                    status.classList.add("error");

                    return;
                }


                const formData =
                    new FormData();

                formData.append(
                    "file",
                    file
                );


                button.disabled = true;

                button.textContent =
                    "Processing report...";

                status.classList.remove("error");

                status.textContent =
                    "Cleaning, transforming and analyzing your SAP report...";


                try {

                    const response =
                        await fetch(
                            "/api/process",
                            {
                                method: "POST",
                                body: formData,
                            }
                        );


                    const result =
                        await response.json();


                    if (!response.ok ||
                        !result.success) {

                        throw new Error(
                            result.message ||
                            "Processing failed."
                        );

                    }


                    status.textContent =
                        "Processing completed. Opening dashboard...";


                    window.location.href =
                        result.redirect || "/";

                } catch (error) {

                    console.error(error);

                    status.textContent =
                        error.message ||
                        "Unable to process the report.";

                    status.classList.add("error");

                    button.disabled = false;

                    button.textContent =
                        "Process Report";
                }

            }
        );

    </script>

</body>

</html>
